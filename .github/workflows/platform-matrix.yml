name: platform-matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-x64
            runner: windows-2022
          - name: windows-arm64
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install and build native addon
        run: npm install --build-from-source --foreground-scripts --no-audit --no-fund

      - name: Run local test suite
        run: npm test

      - name: Run external HTTP and WebSocket tests
        shell: bash
        run: |
          retry() {
            local max_attempts=3
            local attempt=1
            while true; do
              "$@" && return 0
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "External test failed; retrying (${attempt}/${max_attempts})..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry npm run test:tls-config
          retry npm run test:proxy-socks5
          npm run test:proxy-http
          retry npm run test:wss
          retry npm run test:external
          retry npm run test:sync-external
