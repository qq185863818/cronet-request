name: platform-matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-x64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build native addon
        run: npm install --build-from-source --foreground-scripts --no-audit --no-fund

      - name: Run local test suite
        run: npm test

      - name: Run external HTTP and WebSocket tests
        run: |
          npm run test:external
          npm run test:sync-external
          npm run test:wss
